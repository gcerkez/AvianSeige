    <title>Avian Siege: Physics Tower Defense</title>
    <script>
      // Defensive guard against browser extensions attempting to assign to window.fetch
      try {
        const _origFetch = window.fetch;
        let _currentFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _currentFetch; },
          set: function(val) { _currentFetch = val; },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback: ignore
      }
    </script>
